<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Rezerwacje</title>
<style>
body { font-family: "Segoe UI", Arial, sans-serif; margin: 20px; background: #f4f4f4; color: #222; }
h2 { margin: 0 0 12px; }
.uklad { display: flex; gap: 16px; align-items: flex-start; }
.lewa { flex: 0 0 560px; }
.prawa { flex: 1; min-width: 0; }
fieldset { background: #fff; border: 1px solid #ccc; border-radius: 6px; margin: 0 0 12px; padding: 10px 14px; }
legend { font-weight: 600; }
label { display: inline-block; margin: 2px 14px 2px 0; }
input { width: 100px; padding: 3px; }
.opis { font-size: 12px; color: #666; margin: 4px 0 0; }
table { border-collapse: collapse; width: 100%; }
td { padding: 3px 4px; }
td:first-child { width: 150px; }
button { padding: 5px 10px; cursor: pointer; }
#odpowiedzi, #monitor { background: #1e1e1e; color: #ddd; font-family: Consolas, monospace; font-size: 13px; padding: 10px; overflow: auto; white-space: pre-wrap; border-radius: 6px; }
#odpowiedzi { height: 330px; margin-bottom: 10px; }
#monitor { height: 330px; }
.pasek { margin: 6px 0; }
.lua { color: #8a8a8a; }
.ok { color: #7ccf7c; }
.blad { color: #f07070; }
.inf { color: #a0a0a0; }
.sep { color: #e0c060; margin-top: 8px; }
</style>
</head>
<body>
<div class="uklad">
<div class="lewa">

<fieldset>
<legend>Kto pyta</legend>
<label>Klient wysyłany przez A <input id="klientA" value="k1"></label>
<label>Klient wysyłany przez B <input id="klientB" value="k2"></label>
</fieldset>

<fieldset>
<legend>Termin</legend>
<label>Lokal <input id="lokalId" value="lok1"></label>
<label>Pracownik <input id="pracownikId" value="p1"></label>
<label>Data <input id="data" value="2026-12-16"></label>
<label>Godzina <input id="godzina" value="10:00"></label>
</fieldset>

<fieldset>
<legend>Zapytania</legend>
<table>
<tr><td>Pobierz lokal</td>
<td><button onclick="pobierzLokal(instancjaA)">A</button> <button onclick="pobierzLokal(instancjaB)">B</button></td></tr>
<tr><td>Wolne godziny</td>
<td><button onclick="pobierzWolneGodziny(instancjaA)">A</button> <button onclick="pobierzWolneGodziny(instancjaB)">B</button> <button onclick="wyscigWolneGodziny()">A i B naraz</button></td></tr>
<tr><td>Rezerwuj</td>
<td><button onclick="zarezerwuj(instancjaA)">A</button> <button onclick="zarezerwuj(instancjaB)">B</button> <button onclick="wyscigRezerwacja()">A i B naraz</button></td></tr>
<tr><td>Moje rezerwacje</td>
<td><button onclick="pobierzMojeRezerwacje(instancjaA)">A</button> <button onclick="pobierzMojeRezerwacje(instancjaB)">B</button></td></tr>
</table>
</fieldset>

<fieldset>
<legend>Nowy lub edytowany lokal</legend>
<label>Id <input id="nowyLokalId" value="lok18"></label>
<label>Nazwa <input id="nowyLokalNazwa" value="Salon Testowy" style="width:160px"></label>
<label>Typ <input id="nowyLokalTyp" value="fryzjer"></label>
<label>Pracownicy <input id="nowyLokalPracownicy" value="Jan, Ewa" style="width:160px"></label>
<label>Pn-Pt od <input id="nowyLokalOd" value="09:00" style="width:60px"></label>
<label>do <input id="nowyLokalDo" value="17:00" style="width:60px"></label>
<table>
<tr><td>Pobierz ten lokal</td>
<td><button onclick="pobierzNowyLokal(instancjaA)">A</button> <button onclick="pobierzNowyLokal(instancjaB)">B</button></td></tr>
<tr><td>Dodaj (POST)</td>
<td><button onclick="dodajNowyLokal(instancjaA)">A</button> <button onclick="dodajNowyLokal(instancjaB)">B</button></td></tr>
<tr><td>Edytuj (PUT)</td>
<td><button onclick="edytujNowyLokal(instancjaA)">A</button> <button onclick="edytujNowyLokal(instancjaB)">B</button></td></tr>
</table>
</fieldset>

<fieldset>
<legend>Cache</legend>
<button onclick="usunZRedisa(`wolne:${wartoscPola('lokalId')}:${wartoscPola('pracownikId')}:${wartoscPola('data')}`)">Usuń wolne godziny z Redisa</button>
<button onclick="usunZRedisa(`lokal:${wartoscPola('lokalId')}`)">Usuń lokal z Redisa</button>
<button onclick="usunZRedisa(`lokal:${wartoscPola('nowyLokalId')}`)">Usuń nowy lokal z Redisa</button>
</fieldset>

</div>
<div class="prawa">
<div class="pasek"><b>Odpowiedzi</b> <button onclick="oknoOdpowiedzi.textContent = ''">Wyczyść</button></div>
<div id="odpowiedzi"></div>
<div class="pasek"><b>Redis MONITOR</b>
<button onclick="wlaczMonitor()">Włącz</button>
<button onclick="wylaczMonitor()">Wyłącz</button>
<button onclick="oknoMonitora.textContent = ''">Wyczyść</button>
<span id="stanMonitora" class="opis">wyłączony</span></div>
<div id="monitor"></div>
</div>
</div>

<script>
const instancjaA = "http://localhost:5126";
const instancjaB = "http://localhost:5127";
const oknoOdpowiedzi = document.getElementById("odpowiedzi");
const oknoMonitora = document.getElementById("monitor");

function wartoscPola(idPola) {
  return document.getElementById(idPola).value.trim();
}

function klientDlaInstancji(adresInstancji) {
  if (adresInstancji === instancjaA) {
    return wartoscPola("klientA");
  }

  return wartoscPola("klientB");
}

function nazwaInstancji(adresInstancji) {
  if (adresInstancji === instancjaA) {
    return "A";
  }

  return "B";
}

function dopiszLinie(tekst, klasaCss) {
  const linia = document.createElement("div");
  linia.className = klasaCss;
  linia.textContent = tekst;
  oknoOdpowiedzi.appendChild(linia);
  oknoOdpowiedzi.scrollTop = oknoOdpowiedzi.scrollHeight;
}

async function wyslijZapytanie(adresInstancji, metoda, sciezka, klientId, trescZapytania) {
  const naglowki = {};
  if (klientId) {
    naglowki["X-Klient-Id"] = klientId;
  }

  if (trescZapytania) {
    naglowki["Content-Type"] = "application/json";
  }

  const instancja = nazwaInstancji(adresInstancji);
  const poczatek = performance.now();

  try {
    const odpowiedz = await fetch(adresInstancji + sciezka, {
      method: metoda,
      headers: naglowki,
      body: trescZapytania ? JSON.stringify(trescZapytania) : undefined
    });

    const trescOdpowiedzi = await odpowiedz.text();
    const czasMs = Math.round(performance.now() - poczatek);
    const godzinaWyslania = new Date().toLocaleTimeString("pl-PL");
    const pid = odpowiedz.headers.get("X-Pid") ?? "?";
    const klasaCss = odpowiedz.ok ? "ok" : "blad";

    dopiszLinie(`${godzinaWyslania}  ${instancja} (PID ${pid})  ${metoda} ${sciezka}  [klient: ${klientId || "brak"}]  ->  ${odpowiedz.status}  (${czasMs} ms)`, klasaCss);
    dopiszLinie("    " + trescOdpowiedzi, "inf");
  } catch (blad) {
    dopiszLinie(`${instancja}  ${metoda} ${sciezka}  ->  brak połączenia, czy instancja działa?`, "blad");
  }
}

function sciezkaWolnychGodzin() {
  return `/lokale/${wartoscPola("lokalId")}/pracownicy/${wartoscPola("pracownikId")}/wolne?data=${wartoscPola("data")}`;
}

function pobierzLokal(adresInstancji) {
  return wyslijZapytanie(adresInstancji, "GET", `/lokale/${wartoscPola("lokalId")}`, klientDlaInstancji(adresInstancji));
}

function pobierzWolneGodziny(adresInstancji) {
  return wyslijZapytanie(adresInstancji, "GET", sciezkaWolnychGodzin(), klientDlaInstancji(adresInstancji));
}

function zarezerwuj(adresInstancji) {
  const nowaRezerwacja = {
    LokalId: wartoscPola("lokalId"),
    PracownikId: wartoscPola("pracownikId"),
    Data: wartoscPola("data"),
    Godzina: wartoscPola("godzina")
  };

  return wyslijZapytanie(adresInstancji, "POST", "/rezerwacje", klientDlaInstancji(adresInstancji), nowaRezerwacja);
}

function pobierzMojeRezerwacje(adresInstancji) {
  return wyslijZapytanie(adresInstancji, "GET", "/rezerwacje/moje", klientDlaInstancji(adresInstancji));
}

async function wyscigWolneGodziny() {
  dopiszLinie("--- wyścig: wolne godziny, A i B naraz ---", "sep");
  await Promise.all([pobierzWolneGodziny(instancjaA), pobierzWolneGodziny(instancjaB)]);
}

async function wyscigRezerwacja() {
  dopiszLinie(`--- wyścig: rezerwacja ${wartoscPola("godzina")}, A i B naraz ---`, "sep");
  await Promise.all([zarezerwuj(instancjaA), zarezerwuj(instancjaB)]);
}

function usunZRedisa(klucz) {
  return wyslijZapytanie(instancjaA, "DELETE", "/test/cache?klucz=" + encodeURIComponent(klucz), null);
}

function nowyLokalZFormularza() {
  const imiona = wartoscPola("nowyLokalPracownicy")
    .split(",")
    .map(imie => imie.trim())
    .filter(imie => imie);

  const pracownicy = imiona.map((imie, indeks) => {
    return { Id: "p" + (indeks + 1), Imie: imie };
  });

  const dniRobocze = [1, 2, 3, 4, 5];
  const godzinyOtwarcia = dniRobocze.map(dzienTygodnia => {
    return {
      DzienTygodnia: dzienTygodnia,
      OdGodziny: wartoscPola("nowyLokalOd"),
      DoGodziny: wartoscPola("nowyLokalDo")
    };
  });

  return {
    Id: wartoscPola("nowyLokalId"),
    Nazwa: wartoscPola("nowyLokalNazwa"),
    Typ: wartoscPola("nowyLokalTyp"),
    Pracownicy: pracownicy,
    GodzinyOtwarcia: godzinyOtwarcia
  };
}

function pobierzNowyLokal(adresInstancji) {
  return wyslijZapytanie(adresInstancji, "GET", `/lokale/${wartoscPola("nowyLokalId")}`, klientDlaInstancji(adresInstancji));
}

function dodajNowyLokal(adresInstancji) {
  return wyslijZapytanie(adresInstancji, "POST", "/lokale", klientDlaInstancji(adresInstancji), nowyLokalZFormularza());
}

function edytujNowyLokal(adresInstancji) {
  return wyslijZapytanie(adresInstancji, "PUT", `/lokale/${wartoscPola("nowyLokalId")}`, klientDlaInstancji(adresInstancji), nowyLokalZFormularza());
}

const koloryInstancji = ["#7cc4ff", "#ffb86c", "#c3a6ff", "#7ccf7c", "#ff7c9c"];
const kolorDlaPortu = {};
let strumienMonitora = null;

function kolorDlaLinii(liniaMonitora) {
  if (liniaMonitora.includes("[0 lua]")) {
    return null;
  }

  const dopasowanie = liniaMonitora.match(/:(\d+)\]/);
  if (!dopasowanie) {
    return null;
  }

  const port = dopasowanie[1];
  if (!(port in kolorDlaPortu)) {
    kolorDlaPortu[port] = koloryInstancji[Object.keys(kolorDlaPortu).length % koloryInstancji.length];
  }

  return kolorDlaPortu[port];
}

function ustawStanMonitora(tekst) {
  document.getElementById("stanMonitora").textContent = tekst;
}

function wlaczMonitor() {
  if (strumienMonitora) {
    return;
  }

  strumienMonitora = new EventSource(instancjaA + "/test/monitor");
  strumienMonitora.onopen = () => {
    ustawStanMonitora("włączony");
  };

  strumienMonitora.onmessage = zdarzenie => {
    const linia = document.createElement("div");
    linia.textContent = zdarzenie.data;

    const kolor = kolorDlaLinii(zdarzenie.data);
    if (kolor) {
      linia.style.color = kolor;
    } else {
      linia.className = "lua";
    }

    oknoMonitora.appendChild(linia);
    oknoMonitora.scrollTop = oknoMonitora.scrollHeight;
  };

  strumienMonitora.onerror = () => {
    ustawStanMonitora("brak połączenia z /test/monitor");
  };
}

function wylaczMonitor() {
  if (strumienMonitora) {
    strumienMonitora.close();
  }

  strumienMonitora = null;
  ustawStanMonitora("wyłączony");
}
</script>
</body>
</html>
