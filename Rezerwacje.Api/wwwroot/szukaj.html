<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Lokale</title>
<style>
body { font-family: "Segoe UI", Arial, sans-serif; margin: 20px; background: #f4f4f4; color: #222; }
.pasek { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
label { white-space: nowrap; }
input { padding: 4px; }
input { width: 120px; }
button { padding: 5px 14px; cursor: pointer; }
#stan { font-family: Consolas, monospace; font-size: 13px; margin-bottom: 6px; }
.ok { color: #2e7d32; }
.blad { color: #c62828; }
pre { background: #1e1e1e; color: #d4d4d4; font-family: Consolas, monospace; font-size: 13px; line-height: 1.45; padding: 14px; border-radius: 6px; overflow: auto; max-height: 75vh; margin: 0; }
.kl { color: #9cdcfe; }
.tx { color: #ce9178; }
.lb { color: #b5cea8; }
.bo { color: #569cd6; }
.nu { color: #808080; }
</style>
</head>
<body>

<div class="pasek">
<label>Typ <input id="typ"></label>
<label>Nazwa zawiera <input id="fraza"></label>
<button onclick="szukajLokali()">Szukaj</button>
<label><input type="checkbox" id="naZywo" style="width:auto"> na żywo</label>
</div>

<div id="stan"></div>
<pre id="wynik"></pre>

<script>
const poleStanu = document.getElementById("stan");
const poleWyniku = document.getElementById("wynik");
let opoznienieWyszukiwania = null;

function wartoscPola(idPola) {
  return document.getElementById(idPola).value.trim();
}

function pokolorujJson(json) {
  const bezpiecznyJson = json.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const wzorzecElementu = /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(\.\d+)?([eE][+-]?\d+)?)/g;

  return bezpiecznyJson.replace(wzorzecElementu, element => {
    let klasaCss = "lb";
    if (element.startsWith('"')) {
      klasaCss = element.trimEnd().endsWith(":") ? "kl" : "tx";
    } else if (element === "true" || element === "false") {
      klasaCss = "bo";
    } else if (element === "null") {
      klasaCss = "nu";
    }

    return `<span class="${klasaCss}">${element}</span>`;
  });
}

async function szukajLokali() {
  const parametry = new URLSearchParams();
  if (wartoscPola("typ")) {
    parametry.set("typ", wartoscPola("typ"));
  }

  if (wartoscPola("fraza")) {
    parametry.set("fraza", wartoscPola("fraza"));
  }

  const zapytanie = parametry.toString();
  const sciezka = "/lokale" + (zapytanie ? "?" + zapytanie : "");
  const poczatek = performance.now();

  try {
    const odpowiedz = await fetch(sciezka, { headers: { "X-Klient-Id": "k1" } });
    const trescOdpowiedzi = await odpowiedz.text();
    const czasMs = Math.round(performance.now() - poczatek);
    const pid = odpowiedz.headers.get("X-Pid") ?? "?";

    let dane;
    try {
      dane = JSON.parse(trescOdpowiedzi);
    } catch {
      dane = trescOdpowiedzi;
    }

    const liczbaLokali = Array.isArray(dane) ? `, lokali: ${dane.length}` : "";
    poleStanu.className = odpowiedz.ok ? "ok" : "blad";
    poleStanu.textContent = `GET ${sciezka}  ->  ${odpowiedz.status}  (${czasMs} ms, PID ${pid}${liczbaLokali})`;

    if (typeof dane === "string") {
      poleWyniku.textContent = dane;
    } else {
      poleWyniku.innerHTML = pokolorujJson(JSON.stringify(dane, null, 2));
    }
  } catch (blad) {
    poleStanu.className = "blad";
    poleStanu.textContent = "brak połączenia";
    poleWyniku.textContent = "";
  }
}

function szukajNaZywo() {
  if (!document.getElementById("naZywo").checked) {
    return;
  }

  clearTimeout(opoznienieWyszukiwania);
  opoznienieWyszukiwania = setTimeout(szukajLokali, 300);
}

for (const idPola of ["typ", "fraza"]) {
  const poleTekstowe = document.getElementById(idPola);
  poleTekstowe.addEventListener("keydown", zdarzenie => {
    if (zdarzenie.key === "Enter") {
      szukajLokali();
    }
  });
  poleTekstowe.addEventListener("input", szukajNaZywo);
}

szukajLokali();
</script>
</body>
</html>
